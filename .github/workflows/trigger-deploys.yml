name: Trigger Deploys on Package Update

on:
  # Only `release: published`. Publishing a release also creates the tag, so keeping a
  # `push: tags` trigger too made every release dispatch TWICE — each function received
  # two concurrent `gcloud functions deploy` calls and the second failed with
  # "An operation on function X is already in progress", generating a wave of failure
  # emails for deploys that had actually succeeded.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to deploy'
        required: false
        default: 'latest'

# A second safety net: if two cascades ever overlap (a re-run, or a release published
# while another is still fanning out), queue them instead of racing.
concurrency:
  group: release-cascade
  cancel-in-progress: false

jobs:
  trigger-dependent-repos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add repository names (org prefix will be added automatically)
        repo:
          - 'equidade-download-data-function'
          - 'iu-file-checker-function'
          - 'gf_treatment_data_function'
          - 'gf_raw_data_function'
          - 'iu-dataset-update-function'
          - 'consistency_checker_function'
          # Re-enabled 2026-08-26: a new PI wave started, which is the condition the
          # previous comment named. It was commented out while the function did not exist,
          # so that a package release could not recreate a resource deleted on purpose.
          #
          # Safe to dispatch only because the function repository stopped writing the
          # bigquery-loader@ key into the function's CREDENTIALS environment variable
          # (pi_treatment_data_function#6). Before that change, a release here would have
          # rebuilt the function carrying the key this project is retiring -- which is what
          # its own push trigger did on 2026-08-15.
          #
          # Comment it out again when the wave ends and the function is deleted.
          - 'pi_treatment_data_function'
          - 'pi_raw_data_function'
          - 'etl-surveycto-function'
          # STF functions. They have always listened for package-updated; they were
          # simply never added here, so three months of package releases never reached
          # them. Found by cross-referencing the functions carrying a CREDENTIALS env
          # var against this matrix.
          - 'stf-etl-qualtrics'
          - 'stf_treatment_function'
          - 'dataset-update-function'
          - 'equidade-data-package'
          - equidade-access-cloud-functions
          - trigger-dash
          # Add more repository names here
      fail-fast: false

    env:
      # Set your GitHub organization name here
      # Derived from the repository this workflow runs in, so an org rename cannot
      # silently break the cascade again — which is what happened when
      # equidade-info became Instituto-Equidade-info.
      GITHUB_ORG: ${{ github.repository_owner }}

    steps:
      - name: Get package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Triggering deploy for version: ${VERSION}"

      - name: Trigger deploy in ${{ env.GITHUB_ORG }}/${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          repository: ${{ env.GITHUB_ORG }}/${{ matrix.repo }}
          event-type: package-updated
          client-payload: |
            {
              "package": "equidade-data-package",
              "version": "${{ steps.version.outputs.version }}",
              "triggered_by": "${{ github.actor }}",
              "source_repo": "${{ github.repository }}",
              "repo_name": "${{ matrix.repo }}"
            }

  notify-completion:
    needs: trigger-dependent-repos
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Deploy Triggers Summary" >> $GITHUB_STEP_SUMMARY
          echo "Package version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered at: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.trigger-dependent-repos.result }}" >> $GITHUB_STEP_SUMMARY
